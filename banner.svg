<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="sicnutaolei banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#2cb1ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- decorative accent blobs -->
  <circle cx="1040" cy="70" r="120" fill="#7f5af0" opacity="0.18"/>
  <circle cx="1120" cy="250" r="90" fill="#2cb1ff" opacity="0.16"/>

  <rect x="60" y="92" width="64" height="8" rx="4" fill="url(#accent)"/>

  <text x="60" y="178" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="86" font-weight="700" fill="url(#accent)">sicnutaolei</text>

  <text x="64" y="226" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="500" fill="#c7d2fe">前端开发爱好者 · Frontend Enthusiast</text>

  <text x="64" y="272" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">爬虫 · 自动化 · 效率工具　|　Crawler · Automation · Tools</text>
